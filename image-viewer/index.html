<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Viewer</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app">
    <div id="directorySelector">
      <select id="dirSelect">
        <option value=".">Loading directories...</option>
      </select>
    </div>

    <button id="prevBtn" class="nav-btn prev" aria-label="Previous image">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>

    <div id="imageContainer">
      <img id="mainImage" src="" alt="Image viewer">
      <div id="imageInfo"></div>
    </div>

    <button id="nextBtn" class="nav-btn next" aria-label="Next image">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
