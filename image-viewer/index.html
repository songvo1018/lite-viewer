<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Viewer</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app">
    <div id="directorySelector">
      <select id="dirSelect">
        <option value=".">Loading directories...</option>
      </select>
    </div>

    <div id="imageContainer">
      <div id="mediaWrapper"></div>
      <div id="imageInfo"></div>
    </div>

    <button id="infoBtn" class="nav-btn info" aria-label="Network info">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 16v-4"/>
        <path d="M12 8h.01"/>
      </svg>
    </button>

    <button id="prevBtnMobile" class="nav-btn prev" aria-label="Previous image">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>

    <button id="nextBtnMobile" class="nav-btn next" aria-label="Next image">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </button>
  </div>

  <div id="infoModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>Network Access</h2>
      <p>From another device on your local network:</p>
      <div id="ipList" class="ip-list"></div>
      <p>Use port <strong>3000</strong> to access the API directly</p>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
